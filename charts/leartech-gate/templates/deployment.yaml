apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "leartech.fullname" . }}
  labels:
    {{- include "leartech.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "leartech.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "leartech.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "leartech.serviceAccountName" . }}
      securityContext:
        {{- include "leartech.podSecurityContext" . | nindent 8 }}
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: CLUSTER_ID
          value: {{ .Values.config.cluster | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.config.logLevel | quote }}
        {{- if .Values.database.enabled }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.secretName }}
              key: {{ .Values.database.secretKey }}
        {{- end }}
        # THE STANDARD INBOUND AUTH ENV SET. Two public values, both required,
        # no secret and no toggle.
        #
        # This block used to render AUTH_TOKENURL / AUTH_CLIENTID /
        # AUTH_CLIENTSECRET / AUTH_AUDIENCE — envconfig names derived from Go
        # field names, matching nothing any other service renders. The three
        # credential vars were never used either: leartech-gate validates
        # tokens and mints none (its outbound work is GitHub with a PAT), so
        # the secretKeyRef mounted a credential with no consumer.
        - name: LEARTECH_AUTH_ISSUER
          value: {{ required "auth.issuer is required — a resource server that cannot name its issuer must not start" .Values.auth.issuer | quote }}
        - name: LEARTECH_AUTH_AUDIENCE
          value: {{ required "auth.audience is required — RFC 8707 audience binding is not optional" .Values.auth.audience | quote }}
        securityContext:
          {{- include "leartech.containerSecurityContext" . | nindent 10 }}
        livenessProbe:
          {{- include "leartech.livenessProbe" . | nindent 10 }}
        readinessProbe:
          {{- include "leartech.readinessProbe" . | nindent 10 }}
        startupProbe:
          {{- include "leartech.startupProbe" . | nindent 10 }}
        resources:
          {{- include "leartech.resources" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      # readOnlyRootFilesystem=true requires writable volumes for anything that writes
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
